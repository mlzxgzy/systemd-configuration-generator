<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>systemd 配置生成器</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;--green:#3fb950;--key:#ff7b72;--val:#79c0ff;--sec:#7ee787;--cmt:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:600}
.header .sub{color:var(--text2);font-size:13px}
.header .spacer{flex:1}
.lang-btn{padding:4px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:flex;height:calc(100vh - 61px)}
.sidebar{width:200px;min-width:200px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0}
.sidebar .nav-item{padding:10px 20px;cursor:pointer;font-size:14px;color:var(--text2);border-left:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:8px}
.sidebar .nav-item:hover{color:var(--text);background:#1c2128}
.sidebar .nav-item.active{color:var(--accent);background:#0d1a2e;border-left-color:var(--accent);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.panels{flex:1;overflow-y:auto;padding:20px 24px}
.panel{display:none}
.panel.active{display:block}
.panel h2{font-size:16px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-row label .hint{color:var(--text2);font-weight:400;font-size:12px}
input,select,textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px;font-family:"Cascadia Code","Fira Code","JetBrains Mono",monospace;font-size:12px}
select{cursor:pointer}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.check-row input[type="checkbox"]{width:auto;accent-color:var(--accent)}
.env-list{margin-top:4px}
.env-item{display:flex;gap:8px;margin-bottom:6px}
.env-item input{flex:1}
.env-item .btn-del{width:32px;padding:0;cursor:pointer;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--red);font-size:16px}
.env-item .btn-del:hover{background:#2d1b1e}
.btn-add{padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--accent);cursor:pointer;font-size:13px;transition:all .15s}
.btn-add:hover{background:var(--accent2);color:#fff}
.preview{border-top:1px solid var(--border);background:var(--bg2);padding:0}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg3);border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.preview-header .title{font-size:13px;font-weight:600}
.preview-header .title .fn{color:var(--accent);font-family:monospace}
.preview-actions{display:flex;gap:8px;flex-wrap:wrap}
.preview-actions button{padding:4px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:12px;transition:all .15s}
.preview-actions button:hover{border-color:var(--accent);color:var(--accent)}
.preview-actions button.copy:hover{border-color:var(--green);color:var(--green)}
.preview-actions button.dl:hover{border-color:var(--accent);color:var(--accent)}
.preview-actions button.reset:hover{border-color:var(--red);color:var(--red)}
.preview-body{padding:16px 20px;max-height:280px;overflow:auto;font-family:"Cascadia Code","Fira Code","JetBrains Mono",monospace;font-size:13px;line-height:1.6;white-space:pre;tab-size:4}
.preview-body .section{color:var(--sec)}
.preview-body .key{color:var(--key)}
.preview-body .val{color:var(--val)}
.preview-body .com{color:var(--cmt);font-style:italic}
.preview-body .empty{color:var(--text2);font-style:italic}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--green);font-size:13px;z-index:1000;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.cmd-group{margin-bottom:20px}
.cmd-group h3{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.cmd-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;gap:12px}
.cmd-item code{font-family:"Cascadia Code","Fira Code",monospace;font-size:13px;color:var(--val);flex:1}
.cmd-item .cmd-desc{font-size:12px;color:var(--text2);min-width:100px;max-width:200px}
.cmd-item .cmd-copy{padding:3px 10px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:11px;white-space:nowrap;transition:all .15s}
.cmd-item .cmd-copy:hover{border-color:var(--accent);color:var(--accent)}
.cmd-item .cmd-copy.copied{border-color:var(--green);color:var(--green)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;min-width:auto;display:flex;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--border)}.sidebar .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:10px 14px}.sidebar .nav-item.active{border-left-color:transparent;border-bottom-color:var(--accent)}.half-row{grid-template-columns:1fr}.cmd-item{flex-wrap:wrap}}
/* Modal & Toggle */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:999;display:none}
.overlay.show{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;z-index:1000;width:680px;max-width:90vw;max-height:85vh;overflow-y:auto;display:none}
.modal.show{display:block}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.modal .cmd-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:"Cascadia Code","Fira Code",monospace;font-size:13px;line-height:1.6;white-space:pre;overflow-x:auto;margin-bottom:16px;max-height:300px;overflow-y:auto;color:var(--text)}
.modal .cmd-box .hl-section{color:var(--sec)}
.modal .cmd-box .hl-cmd{color:var(--val)}
.modal .cmd-box .hl-comment{color:var(--cmt);font-style:italic}
.modal .toggle-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.modal .toggle-row label{font-size:14px;cursor:pointer;flex:1;color:var(--text)}
.modal .toggle-row .hint{font-size:12px;color:var(--text2);display:block;margin-top:2px}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--bg3);border:1px solid var(--border);border-radius:12px;transition:.2s}
.toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:2px;bottom:2px;background:var(--text2);border-radius:50%;transition:.2s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent2);border-color:var(--accent)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px);background:#fff}
.modal .toggle-row .toggle-switch{flex:none}
.modal-actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.modal-actions button{padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid var(--border);transition:all .15s}
.btn-deploy-copy{background:var(--accent2);color:#fff;border-color:var(--accent)!important}
.btn-deploy-copy:hover{background:#388bfd}
.btn-deploy-close{background:transparent;color:var(--text2)}
.btn-deploy-close:hover{color:var(--text);background:var(--bg3)}
.modal .tip{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5}</style>
</head>

<div class="header">
  <h1>⚙️</h1>
  <span class="sub" id="headerSub"></span>
  <span class="spacer"></span>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()"></button>
</div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="panels" id="panels"></div>
    <div class="preview">
      <div class="preview-header">
        <span class="title"><span class="fn" id="previewTitleText">myservice.service</span></span>
        <div class="preview-actions">
          <button onclick="copyPreview()" class="copy" id="btnCopy">复制</button>
          <button onclick="downloadPreview()" class="dl" id="btnDownload">下载</button>
          <button onclick="resetAll()" class="reset" id="btnReset">清空</button>
          <button onclick="showDeploy()" class="dl" id="btnDeploy">部署</button>
        </div>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="overlay" id="deployOverlay" onclick="closeDeploy()"></div>
<div class="modal" id="deployModal">

  <div class="cmd-box" id="deployCmdBox"></div>
  <div class="toggle-row">
    <label id="deployStartLabel">启动服务 <span class="hint" id="deployStartHint">部署后立即启动</span></label>
    <label class="toggle-switch"><input type="checkbox" id="deployStartToggle" checked onchange="updateDeployCmd()"><span class="toggle-slider"></span></label>
  </div>
  <div class="toggle-row">
    <label id="deployEnableLabel">开机自启 <span class="hint" id="deployEnableHint">设置 systemctl enable</span></label>
    <label class="toggle-switch"><input type="checkbox" id="deployEnableToggle" checked onchange="updateDeployCmd()"><span class="toggle-slider"></span></label>
  </div>
  <div class="modal-actions">
    <button class="btn-deploy-copy" id="deployCopyBtn" onclick="copyDeployCmd()">复制命令</button>
    <button id="deployCloseBtn" class="btn-deploy-close" onclick="closeDeploy()">关闭</button>
  </div>

function esc(s){if(s==null)return "";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function renderSidebar(){const e=document.getElementById("sidebar");e.innerHTML=sections.map((s,i)=>"<div class=\"nav-item"+(i===0?" active":"")+"\" data-section=\""+s.id+"\" onclick=\"switchSection('"+s.id+"')\">"+s.icon+" "+t(s.label)+"</div>").join("")}
function renderField(f){const v=formData[f.key];const rs=f.required?" ("+t("required")+")":"";switch(f.type){case"checkbox":return '<div class="check-row"><input type="checkbox" data-key="'+f.key+'" id="f-'+f.key+'"'+(v?" checked":"")+'><label for="f-'+f.key+'">'+f.label+' <span class="hint">'+t(f.hint)+'</span></label></div>';case"select":let opts="";if(Array.isArray(f.options)){opts=f.options.map(o=>{const ov=typeof o==="string"?o:o.v;const ol=typeof o==="string"?o:t(o.l);return '<option value="'+ov+'"'+(v===ov?" selected":"")+">"+ol+"</option>"}).join("")}return '<div class="form-row"><label for="f-'+f.key+'">'+f.label+rs+' <span class="hint">'+t(f.hint)+'</span></label><select data-key="'+f.key+'" id="f-'+f.key+'">'+opts+'</select></div>';case"custom":if(f.key==="_env_list"){return '<div class="form-row"><label>'+f.label+' <span class="hint">'+t(f.hint)+'</span></label><div class="env-list">'+formData.EnvironmentPairs.map((p,i)=>envRowHTML(i)).join("")+'<button class="btn-add" type="button">'+t("btnAddEnv")+'</button></div></div>'}return"";default:return '<div class="form-row"><label for="f-'+f.key+'">'+f.label+rs+' <span class="hint">'+t(f.hint)+'</span></label><input type="text" data-key="'+f.key+'" id="f-'+f.key+'" value="'+esc(v)+'" placeholder="'+t(f.hint)+'"></div>'}}
function envRowHTML(i){const p=formData.EnvironmentPairs[i]||{key:"",value:""};return '<div class="env-item" data-idx="'+i+'"><input type="text" class="env-key" value="'+esc(p.key)+'" placeholder="'+t("envPlaceholderKey")+'"><input type="text" class="env-val" value="'+esc(p.value)+'" placeholder="'+t("envPlaceholderVal")+'"><button class="btn-del" onclick="delEnvRow(this)">\u2715</button></div>'}
function initEnvFields(){document.querySelectorAll(".env-list").forEach(function(l){l.addEventListener("input",function(e){var item=e.target.closest(".env-item");if(!item)return;var idx=parseInt(item.dataset.idx);var key=item.querySelector(".env-key").value;var val=item.querySelector(".env-val").value;if(!formData.EnvironmentPairs[idx])formData.EnvironmentPairs[idx]={key:"",value:""};formData.EnvironmentPairs[idx].key=key;formData.EnvironmentPairs[idx].value=val;renderPreview();saveState()})})}
function addEnvRow(listEl){formData.EnvironmentPairs.push({key:"",value:""});listEl.innerHTML=formData.EnvironmentPairs.map(function(p,i){return envRowHTML(i)}).join("")+'<button class="btn-add" type="button">'+t("btnAddEnv")+"</button>";listEl.querySelector(".btn-add").addEventListener("click",function(){addEnvRow(listEl)});initEnvFields();renderPreview();saveState()}
function delEnvRow(btn){var item=btn.closest(".env-item");var idx=parseInt(item.dataset.idx);formData.EnvironmentPairs.splice(idx,1);var list=item.closest(".env-list");list.innerHTML=formData.EnvironmentPairs.map(function(p,i){return envRowHTML(i)}).join("")+'<button class="btn-add" type="button">'+t("btnAddEnv")+"</button>";list.querySelector(".btn-add").addEventListener("click",function(){addEnvRow(list)});initEnvFields();renderPreview();saveState()}
function renderPanels(){const el=document.getElementById("panels");el.innerHTML=sections.map(function(s){if(s.isCommands)return renderCommandsPanel(s);return '<div class="panel'+(s.id==="basic"?" active":"")+'" id="panel-'+s.id+'"><h2>'+s.icon+" "+t(s.label)+"</h2>"+s.fields.map(function(f){return renderField(f)}).join("")+"</div>"}).join("");document.querySelectorAll(".env-list").forEach(function(el){var btn=el.querySelector(".btn-add");if(btn)btn.addEventListener("click",function(){addEnvRow(el)})});document.querySelectorAll("[data-key]").forEach(function(el){var key=el.dataset.key;if(el.tagName==="INPUT"&&el.type==="checkbox"){el.addEventListener("change",function(){sd(key,el.checked)})}else if(el.tagName==="INPUT"||el.tagName==="SELECT"){el.addEventListener("input",function(){sd(key,el.value)});el.addEventListener("change",function(){sd(key,el.value)})}});initEnvFields();renderPreview()}
function renderCommandsPanel(s){return '<div class="panel" id="panel-'+s.id+'"><h2>\ud83d\udca1 '+t("secCommands")+"</h2>"+cmdGroups.map(function(g){return '<div class="cmd-group"><h3>'+t(g.title)+"</h3>"+g.cmds.map(function(c){return '<div class="cmd-item"><code>'+esc(c.cmd)+'</code><span class="cmd-desc">'+t(c.descKey)+'</span><button class="cmd-copy" onclick="copyCmd(this,\''+esc(c.cmd)+"\')"+'">'+t("btnCopyCmd")+"</button></div>"}).join("")+"</div>"}).join("")+"</div>"}
function switchSection(id){document.querySelectorAll(".sidebar .nav-item").forEach(function(el){el.classList.remove("active")});document.querySelectorAll(".panel").forEach(function(el){el.classList.remove("active")});var nav=document.querySelector(".sidebar [data-section=\""+id+"\"]");if(nav)nav.classList.add("active");var p=document.getElementById("panel-"+id);if(p)p.classList.add("active")}
function generateConfig(){var L=[];L.push("[Unit]");L.push("Description="+(fd("Description")||"My Service"));["Documentation","After","Requires","Wants","BindsTo","PartOf","ConditionPathExists"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});L.push("");L.push("[Service]");L.push("Type="+(fd("Type")||"simple"));if(fd("ExecStart")){L.push("ExecStart="+fd("ExecStart"))}else{L.push("# ExecStart= (not set)")}["ExecStop","ExecReload","WorkingDirectory","RootDirectory"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});if(fd("RemainAfterExit"))L.push("RemainAfterExit=yes");if(fd("Restart")&&fd("Restart")!=="no"){L.push("Restart="+fd("Restart"));var rs=fd("RestartSec");if(rs)L.push("RestartSec="+rs)}["StartLimitIntervalSec","StartLimitBurst"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});if(fd("StartLimitAction")&&fd("StartLimitAction")!=="none")L.push("StartLimitAction="+fd("StartLimitAction"));["CPUQuota","MemoryMax","MemoryHigh","MemorySwapMax","IOWeight","CPUShares","AllowedCPUs","AllowedMemoryNodes"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});if(fd("TasksMax"))L.push("TasksMax="+fd("TasksMax"));["User","Group","CapabilityBoundingSet","ReadOnlyPaths","ReadWritePaths","InaccessiblePaths","SystemCallFilter","SystemCallArchitectures"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});if(fd("ProtectSystem"))L.push("ProtectSystem="+fd("ProtectSystem"));if(fd("ProtectHome"))L.push("ProtectHome="+fd("ProtectHome"));["PrivateTmp","PrivateDevices","PrivateNetwork","NoNewPrivileges","ProtectKernelModules","ProtectControlGroups","ProtectKernelTunables","ProtectClock"].forEach(function(k){if(fd(k))L.push(k+"=true")});["StandardOutput","StandardError","SyslogIdentifier","SyslogFacility","LogLevelMax"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});var envPairs=formData.EnvironmentPairs.filter(function(p){return p.key.trim()});if(envPairs.length>0){L.push("Environment="+envPairs.map(function(p){return p.key.trim()+"=\""+p.value.trim()+"\""}).join(" "))}var ef=fd("EnvironmentFile");if(ef)L.push("EnvironmentFile="+ef);L.push("");L.push("[Install]");if(fd("WantedBy"))L.push("WantedBy="+fd("WantedBy"));["Also","Alias"].forEach(function(k){var v=fd(k);if(v)L.push(k+"="+v)});return L.join("\n")}
function renderPreview(){var body=document.getElementById("previewBody");var config=generateConfig();if(!config.trim()){body.innerHTML="<span class=\"empty\">"+t("previewEmpty")+"</span>";return}var hl=config.split("\n").map(function(line){if(!line.trim())return"";if(line.startsWith("#"))return"<span class=\"com\">"+esc(line)+"</span>";if(line.startsWith("["))return"<span class=\"section\">"+esc(line)+"</span>";var idx=line.indexOf("=");if(idx>0){return"<span class=\"key\">"+esc(line.substring(0,idx))+"</span><span class=\"val\">"+esc(line.substring(idx))+"</span>"}return esc(line)}).join("\n");body.innerHTML=hl}
function copyPreview(){var text=generateConfig();navigator.clipboard.writeText(text).then(function(){showToast(t("toastCopied"))})["catch"](function(){var ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();showToast(t("toastCopied"))})}
function downloadPreview(){var text=generateConfig();var blob=new Blob([text],{type:"text/plain;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);var name=(fd("Description")||"myservice").replace(/\s+/g,"_").toLowerCase();a.download=name+".service";a.click();URL.revokeObjectURL(a.href);showToast(t("toastDownloaded"))}
function resetAll(){if(!confirm(t("confirmReset")))return;Object.keys(formData).forEach(function(k){if(Array.isArray(formData[k])){formData[k]=[{key:"",value:""}]}else if(typeof formData[k]==="boolean"){formData[k]=false}else{formData[k]=""}});formData.Description="My Service";formData.After="network.target";formData.Type="simple";formData.Restart="on-failure";formData.RestartSec="5";formData.TasksMax="infinity";formData.WantedBy="multi-user.target";formData.StartLimitAction="none";renderPanels();showToast(t("toastReset"));localStorage.removeItem(STORE_KEY)}
function copyCmd(btn,cmd){navigator.clipboard.writeText(cmd).then(function(){btn.textContent=t("btnCopied");btn.classList.add("copied");setTimeout(function(){btn.textContent=t("btnCopyCmd");btn.classList.remove("copied")},1500)})["catch"](function(){showToast(t("toastCopied"))})}
function showToast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("show")},2500)}
function showDeploy(){document.getElementById("deployOverlay").classList.add("show");document.getElementById("deployModal").classList.add("show");updateDeployCmd()}
function closeDeploy(){document.getElementById("deployOverlay").classList.remove("show");document.getElementById("deployModal").classList.remove("show")}
function updateDeployCmd(){var name=(fd("Description")||"myservice").replace(/\s+/g,"_").toLowerCase();var config=generateConfig();var start=document.getElementById("deployStartToggle").checked;var enable=document.getElementById("deployEnableToggle").checked;var lines=[];lines.push("# Deploy "+name+".service");lines.push("sudo tee /etc/systemd/system/"+name+".service > /dev/null << 'SERVICEFILE'");lines.push(config);lines.push("SERVICEFILE");lines.push("sudo systemctl daemon-reload");if(start)lines.push("sudo systemctl start "+name);if(enable)lines.push("sudo systemctl enable "+name);lines.push("");lines.push("sudo systemctl status "+name+" --no-pager");document.getElementById("deployCmdBox").textContent=lines.join("\n")}
function copyDeployCmd(){var text=document.getElementById("deployCmdBox").textContent;navigator.clipboard.writeText(text).then(function(){var btn=document.getElementById("deployCopyBtn");btn.textContent=t("btnDeployCopied");setTimeout(function(){btn.textContent=t("btnDeployCopy")},2000)})["catch"](function(){showToast(t("toastCopied"))})}
loadState();applyLang();renderSidebar();renderPanels();
